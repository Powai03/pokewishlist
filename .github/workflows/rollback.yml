name: Rollback

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit à remettre en ligne (vide : dernier déploiement stable avant la version actuelle)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: rollback
  cancel-in-progress: false

jobs:
  choose:
    name: Choisir la version à restaurer
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ vars.API_URL }}
          WANTED: ${{ inputs.commit }}
        run: |
          current=$(curl --silent --max-time 15 "$API_URL/health" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).commit)}catch{console.log("")}})')
          echo "Version en ligne : ${current:-inconnue}"

          if [ -n "$WANTED" ]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$WANTED" -q .sha)
          else
            mapfile -t stable < <(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
              --event push --status success -L 50 --json headSha -q '.[].headSha')
            echo "Déploiements stables (récent → ancien) :"; printf '  %s\n' "${stable[@]:0:5}"
            sha=""
            for i in "${!stable[@]}"; do
              if [ "${stable[$i]}" = "$current" ]; then sha="${stable[$((i + 1))]:-}"; break; fi
            done
            [ -n "$sha" ] || sha="${stable[0]:-}"
          fi
          if [ -z "$sha" ] || [ "$sha" = "$current" ]; then
            echo "::error::Aucune version précédente à restaurer"; exit 1
          fi
          echo "Version restaurée : $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Retour arrière"
            echo "- en ligne avant : \`${current:-inconnue}\`"
            echo "- version restaurée : \`$sha\` ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$sha)"
          } >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: Redéployer la version choisie
    needs: choose
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ needs.choose.outputs.sha }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read
