name: Rollback

# Retour arrière : remettre en ligne une version PRÉCÉDENTE (API Lambda, site SSR Vercel, site SSG CloudFront).
#
# Lancement : onglet Actions → Rollback → « Run workflow » (depuis main).
#   · sans commit : le DERNIER DÉPLOIEMENT STABLE avant la version en ligne, c'est-à-dire la dernière exécution
#     VERTE du pipeline sur main (un pipeline vert sur main = une version testée ET déployée) ;
#   · avec un commit : cette version-là (par exemple pour revenir ensuite à la plus récente).
#
# Le redéploiement passe par le MÊME workflow que les mises en ligne (deploy.yml), smoke tests compris :
# le retour arrière est lui-même vérifié en ligne.
# La base n'est PAS remise en arrière : les migrations ne vont que vers l'avant et restent compatibles avec
# la version précédente (on ajoute, on ne supprime pas : « expand / contract »).
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit à remettre en ligne (vide : dernier déploiement stable avant la version actuelle)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read # lire l'historique des exécutions du pipeline

concurrency:
  group: rollback
  cancel-in-progress: false

jobs:
  choose:
    name: Choisir la version à restaurer
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production # pour lire API_URL
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ vars.API_URL }}
          WANTED: ${{ inputs.commit }}
        run: |
          # 1. La version actuellement en ligne : le commit renvoyé par /health.
          current=$(curl --silent --max-time 15 "$API_URL/health" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).commit)}catch{console.log("")}})')
          echo "Version en ligne : ${current:-inconnue}"

          if [ -n "$WANTED" ]; then
            # 2a. Version demandée explicitement (SHA court ou complet).
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$WANTED" -q .sha)
          else
            # 2b. Dernier déploiement stable AVANT la version en ligne : exécutions vertes du pipeline sur main,
            #     de la plus récente à la plus ancienne ; on prend celle qui suit la version en ligne.
            mapfile -t stable < <(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
              --event push --status success -L 50 --json headSha -q '.[].headSha')
            echo "Déploiements stables (récent → ancien) :"; printf '  %s\n' "${stable[@]:0:5}"
            sha=""
            for i in "${!stable[@]}"; do
              if [ "${stable[$i]}" = "$current" ]; then sha="${stable[$((i + 1))]:-}"; break; fi
            done
            # Version en ligne absente de la liste (déjà un retour arrière vers une version plus ancienne) :
            # on prend le dernier déploiement stable.
            [ -n "$sha" ] || sha="${stable[0]:-}"
          fi
          if [ -z "$sha" ] || [ "$sha" = "$current" ]; then
            echo "::error::Aucune version précédente à restaurer"; exit 1
          fi
          echo "Version restaurée : $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Retour arrière"
            echo "- en ligne avant : \`${current:-inconnue}\`"
            echo "- version restaurée : \`$sha\` ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$sha)"
          } >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: Redéployer la version choisie
    needs: choose
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ needs.choose.outputs.sha }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read
