name: CI/CD

# Un seul pipeline, en étapes reliées par `needs:` (GitHub les dessine en graphe dans l'onglet Actions) :
#
#   i18n ───────────┬──────────────────────────────────────────────┐
#   API · Install ──┼─▶ API · Prettier/ESLint/Typecheck/Vitest ──┬─▶ API · Build + /health ─┐
#                   └─▶ API · Tests BDD (Postgres) ──────────────┘                         ├─▶ E2E
#   Install ──────────▶ Prettier/ESLint/Typecheck/Vitest ───────────▶ Build ───────────────┘
#
#   puis, sur main uniquement :  E2E ─▶ Migrate DB ─▶ Deploy (deploy.yml) : Deploy API ─┬─▶ Deploy (Vercel, SSR)
#                                                                                     └─▶ Deploy SSG (S3 + CloudFront)
#
# · Un job ne démarre que si ceux dont il dépend ont RÉUSSI : un check rouge arrête la suite.
# · Les déploiements ne tournent que sur un push dans main (donc après un merge), jamais pour une PR.
on:
  push:
  pull_request:

# Une PR repoussée annule son exécution précédente. Sur main, jamais : on n'interrompt pas un déploiement.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Droits minimaux par défaut (lecture du code) ; le déploiement AWS demande en plus son jeton OIDC.
permissions:
  contents: read

jobs:
  # ── Étape 1 : installer une fois, mettre en cache ─────────────────────────────────────────────
  # node_modules est mis en cache (clé = package-lock.json) ; les jobs suivants le récupèrent
  # au lieu de relancer `npm ci` chacun de leur côté.
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: cache
        uses: actions/cache@v6
        with:
          path: ./node_modules
          key: node-modules-${{ runner.os }}-node24-.-${{ hashFiles('./package-lock.json') }}
      - name: npm ci (versions exactes du package-lock.json)
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  api-install:
    name: API · Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: cache
        uses: actions/cache@v6
        with:
          path: api/node_modules
          key: node-modules-${{ runner.os }}-node24-api-${{ hashFiles('api/package-lock.json') }}
      - name: npm ci (api/)
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: api

  # Traductions : chaque fichier de langue (front i18n/locales, API api/src/locales) doit avoir
  # exactement les clés de en.json. Aucune dépendance : Node seul, quelques secondes.
  locales:
    name: i18n (clés des locales)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: node scripts/check-locales.mjs (npm run check:locales)
        run: node scripts/check-locales.mjs

  # ── Étape 2 : contrôles de qualité, en parallèle (un check par outil) ─────────────────────────
  check:
    name: ${{ matrix.name }}
    needs: install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # un check rouge n'arrête pas les autres
      matrix:
        include:
          - name: Format (Prettier)
            script: format:check
          - name: Lint (ESLint)
            script: lint
          - name: Typecheck
            script: typecheck
          - name: Tests (Vitest)
            script: test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-modules
        with:
          nuxt-prepare: 'true'
      - name: npm run ${{ matrix.script }}
        run: npm run ${{ matrix.script }}

  api-check:
    name: API · ${{ matrix.name }}
    needs: api-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format (Prettier)
            script: format:check
          - name: Lint (ESLint)
            script: lint
          - name: Typecheck
            script: typecheck
          - name: Tests (Vitest)
            script: test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-modules
        with:
          dir: api
      - name: npm run ${{ matrix.script }}
        run: npm run ${{ matrix.script }}

  # Tests d'intégration du stockage sur un VRAI serveur PostgreSQL 17 (même version que Supabase),
  # lancé à côté du job (« service container ») : base jetable, isolée, détruite à la fin du job.
  # Le schéma vient de supabase/init.sql ; aucun mock SQL. (En local, ces tests utilisent PGlite.)
  api-db:
    name: API · Tests BDD (Postgres)
    needs: api-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          # Base jetable, joignable seulement depuis ce job : connexion sans mot de passe (« trust »).
          # Aucun mot de passe dans le dépôt → rien que GitGuardian puisse signaler.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-modules
        with:
          dir: api
      - name: vitest run test/db (npm run test:db)
        run: npm run test:db

  # ── Étape 3 : builds (seulement si les contrôles sont verts) ──────────────────────────────────
  build:
    name: Build
    needs: [check, locales]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-modules
      # Les 156 fiches PRÉ-RENDUES figent au build l'adresse de l'API : on construit donc avec celle de l'API
      # de test de l'E2E (port 3101). Le déploiement, lui, reconstruit avec l'adresse de production.
      - name: nuxt build pour l'E2E (npm run build:e2e)
        run: npm run build:e2e
      # Le site compilé est transmis au job E2E (pas de 2e build).
      - uses: actions/upload-artifact@v7
        with:
          name: front-build
          path: .output/
          include-hidden-files: true
          retention-days: 1

  # Build de l'API, démarrage du vrai serveur compilé et appel de GET /health (smoke test),
  # puis paquet AWS Lambda construit et appelé sans AWS : il fonctionne AVANT tout déploiement.
  api-build:
    name: API · Build + /health
    needs: [api-check, api-db, locales]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-modules
        with:
          dir: api

      - name: tsc -p tsconfig.build.json (npm run build)
        run: npm run build

      - name: "Smoke test : démarrer l'API et appeler GET /health"
        env:
          NODE_ENV: production
          PORT: 3002
        run: |
          # Le serveur écrit dans server.log et est TOUJOURS arrêté à la fin (succès ou échec).
          node dist/index.js > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID; echo "--- journal du serveur"; cat server.log' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            http://localhost:3002/health | tee health.json
          echo
          node -e '
            const health = JSON.parse(require("fs").readFileSync("health.json", "utf8"))
            const { version } = JSON.parse(require("fs").readFileSync("package.json", "utf8"))
            const ok = health.status === "ok" && health.env === "production" && health.version === version
            if (!ok) { console.error("Réponse /health inattendue :", health); process.exit(1) }
            console.log(`OK : status=${health.status}, version=${health.version}, env=${health.env}`)
          '

      - name: Paquet AWS Lambda (npm run build:lambda) + appel du handler
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          npm run build:lambda
          node scripts/invoke-lambda.mjs "$GIT_COMMIT"

      - uses: actions/upload-artifact@v7
        with:
          name: api-build
          path: api/dist/
          retention-days: 1

  # ── Étape 4 : test de bout en bout ────────────────────────────────────────────────────────────
  # Un vrai navigateur pilote le front compilé (job Build), qui parle à la VRAIE API compilée (job API · Build).
  # Seule PokéAPI est simulée (faux serveur pour le rendu serveur de la fiche).
  e2e:
    name: E2E (Playwright)
    needs: [build, api-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-modules
      - name: Récupérer node_modules (api) depuis le cache
        uses: actions/cache/restore@v6
        with:
          path: api/node_modules
          key: node-modules-${{ runner.os }}-node24-api-${{ hashFiles('api/package-lock.json') }}
          fail-on-cache-miss: true

      - name: Récupérer le site compilé (job Build)
        uses: actions/download-artifact@v8
        with:
          name: front-build
          path: .output

      - name: Récupérer l'API compilée (job API · Build)
        uses: actions/download-artifact@v8
        with:
          name: api-build
          path: api/dist

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      # Les serveurs sont démarrés EXPLICITEMENT (visibles dans Actions), en arrière-plan,
      # avec leurs journaux dans des fichiers. Playwright les réutilise (reuseExistingServer en CI).
      - name: Démarrer l'API Hono (port 3101)
        working-directory: api
        env:
          PORT: 3101
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:3100
        run: nohup node dist/index.js > ../api.log 2>&1 &

      # Faux PokéAPI pour la fiche /pokemon/:id, chargée par le serveur Nuxt (SSR) : page.route() ne la voit pas.
      - name: Démarrer le faux PokéAPI (port 3102)
        env:
          PORT: 3102
        run: nohup node e2e/pokeapi-mock.mjs > pokeapi-mock.log 2>&1 &

      - name: Démarrer le front Nuxt (port 3100)
        env:
          PORT: 3100
          NUXT_PUBLIC_API_BASE: http://localhost:3101
          NUXT_PUBLIC_POKEAPI_BASE: http://localhost:3102
        run: nohup node .output/server/index.mjs > nuxt.log 2>&1 &

      - name: Attendre que les trois serveurs répondent
        run: |
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
            http://localhost:3101/health
          echo
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
            http://localhost:3102/health
          echo
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
            --output /dev/null --write-out "front Nuxt : HTTP %{http_code}\n" http://localhost:3100

      - name: playwright test (npm run e2e)
        run: npm run e2e

      - name: Journaux des serveurs (si échec)
        if: failure()
        run: |
          echo "─── API Hono (api.log) ───"; cat api.log || true
          echo "─── front Nuxt (nuxt.log) ───"; cat nuxt.log || true
          echo "─── faux PokéAPI (pokeapi-mock.log) ───"; cat pokeapi-mock.log || true

      - name: Rapport Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── Étape 5 : déploiement continu (CD), seulement sur main, quand TOUT ce qui précède est vert ──
  #
  # Sécurité AWS : AUCUNE clé d'accès stockée dans GitHub. GitHub prouve son identité à AWS par OIDC
  # (jeton signé, valable quelques minutes) ; AWS l'échange contre des droits temporaires sur UN rôle,
  # qui ne peut que mettre à jour le code de CETTE fonction Lambda (voir infra/aws-setup.sh).
  # DATABASE_URL n'est jamais dans GitHub : elle est dans la configuration de la fonction Lambda.
  # Migrations de la base (supabase/migrations/NNN_*.sql) AVANT le nouveau code : il peut avoir besoin du
  # nouveau schéma. Le runner (api/src/migrations.ts) n'applique que ce qui n'est pas encore noté dans
  # schema_migrations : relancé à chaque merge, il ne refait jamais une migration déjà passée.
  # Les migrations doivent rester compatibles avec le code ENCORE en ligne (ajouter, pas supprimer).
  migrate:
    name: Migrate DB (Supabase)
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: deploy-production-db
      cancel-in-progress: false
    env:
      # Secret de l'environnement production (main uniquement), jamais affiché dans les journaux.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    defaults:
      run:
        working-directory: api
    steps:
      - name: Vérifier la configuration (secret DATABASE_URL)
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Secret manquant : DATABASE_URL"; exit 1; fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-modules
        with:
          dir: api
      - name: Appliquer les migrations (npm run migrate)
        run: npm run migrate

  # Déploiement du commit du merge : workflow réutilisable deploy.yml (le même que le retour arrière).
  deploy:
    name: Deploy
    needs: migrate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit
    permissions:
      id-token: write # connexion à AWS par OIDC (jobs Deploy API et Deploy SSG)
      contents: read
