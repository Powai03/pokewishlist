name: CI

# Se déclenche à chaque push (toutes branches) et à chaque Pull Request.
on:
  push:
  pull_request:

# Si on repousse sur la même branche, on annule l'exécution précédente devenue inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 4 jobs indépendants = 4 « checks » distincts visibles sur la PR.
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # un check rouge n'arrête pas les autres
      matrix:
        task: [lint, typecheck, test, build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci # installe exactement les versions du package-lock.json

      - name: npm run ${{ matrix.task }}
        run: npm run ${{ matrix.task }}
