name: CI

# Se déclenche à chaque push (toutes branches) et à chaque Pull Request.
on:
  push:
  pull_request:

# Si on repousse sur la même branche, on annule l'exécution précédente devenue inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 5 jobs indépendants = 5 « checks » distincts visibles sur la PR (+ le job e2e plus bas).
  # Chaque check porte le nom de son OUTIL ; `cmd` affiche la commande réellement lancée
  # (celle du script npm correspondant dans package.json).
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # un check rouge n'arrête pas les autres
      matrix:
        include:
          - name: ESLint
            script: lint
            cmd: eslint . --max-warnings 0
          - name: Prettier
            script: format:check
            cmd: prettier --check .
          - name: TypeScript
            script: typecheck
            cmd: nuxt typecheck
          - name: Vitest
            script: test
            cmd: vitest run
          - name: Build Nuxt
            script: build
            cmd: nuxt build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci # installe exactement les versions du package-lock.json

      - name: ${{ matrix.cmd }} (npm run ${{ matrix.script }})
        run: npm run ${{ matrix.script }}

  # Test de bout en bout : un vrai navigateur ajoute un Pokémon, rafraîchit, vérifie la liste.
  e2e:
    name: Playwright (E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Build de l'application
        run: npm run build

      - name: playwright test (npm run e2e)
        run: npm run e2e

      - name: Rapport Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # API (Hono + TypeScript), dans le dossier api/ : installation, vérifications, build,
  # puis démarrage du vrai serveur et appel de GET /health (smoke test).
  # ESLint et Prettier de la racine couvrent déjà api/ (checks ESLint et Prettier).
  api:
    name: API (Hono)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Installer les dépendances (npm ci)
        run: npm ci

      - name: tsc --noEmit (npm run typecheck)
        run: npm run typecheck

      - name: vitest run (npm run test)
        run: npm run test

      - name: tsc -p tsconfig.build.json (npm run build)
        run: npm run build

      - name: "Smoke test : démarrer l'API et appeler GET /health"
        env:
          NODE_ENV: production
          PORT: 3002
        run: |
          # Le serveur écrit dans server.log et est TOUJOURS arrêté à la fin (succès ou échec).
          node dist/index.js > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID; echo "--- journal du serveur"; cat server.log' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            http://localhost:3002/health | tee health.json
          echo
          node -e '
            const health = JSON.parse(require("fs").readFileSync("health.json", "utf8"))
            const { version } = JSON.parse(require("fs").readFileSync("package.json", "utf8"))
            const ok = health.status === "ok" && health.env === "production" && health.version === version
            if (!ok) { console.error("Réponse /health inattendue :", health); process.exit(1) }
            console.log(`OK : status=${health.status}, version=${health.version}, env=${health.env}`)
          '
