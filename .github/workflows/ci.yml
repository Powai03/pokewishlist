name: CI/CD

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: cache
        uses: actions/cache@v6
        with:
          path: ./node_modules
          key: node-modules-${{ runner.os }}-node24-.-${{ hashFiles('./package-lock.json') }}
      - name: npm ci (versions exactes du package-lock.json)
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  api-install:
    name: API · Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: cache
        uses: actions/cache@v6
        with:
          path: api/node_modules
          key: node-modules-${{ runner.os }}-node24-api-${{ hashFiles('api/package-lock.json') }}
      - name: npm ci (api/)
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: api

  locales:
    name: i18n (clés des locales)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: node scripts/check-locales.mjs (npm run check:locales)
        run: node scripts/check-locales.mjs

  check:
    name: ${{ matrix.name }}
    needs: install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format (Prettier)
            script: format:check
          - name: Lint (ESLint)
            script: lint
          - name: Typecheck
            script: typecheck
          - name: Tests (Vitest)
            script: test:coverage
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-modules
        with:
          nuxt-prepare: 'true'
      - name: npm run ${{ matrix.script }}
        run: npm run ${{ matrix.script }}
      - name: Résumé de la couverture
        if: matrix.script == 'test:coverage'
        run: node scripts/coverage-summary.mjs summary coverage front >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: matrix.script == 'test:coverage'
        with:
          name: coverage-front
          path: coverage/
          retention-days: 7

  api-check:
    name: API · ${{ matrix.name }}
    needs: api-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format (Prettier)
            script: format:check
          - name: Lint (ESLint)
            script: lint
          - name: Typecheck
            script: typecheck
          - name: Tests (Vitest)
            script: test:coverage
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-modules
        with:
          dir: api
      - name: npm run ${{ matrix.script }}
        run: npm run ${{ matrix.script }}
      - name: Résumé de la couverture
        if: matrix.script == 'test:coverage'
        run: node ../scripts/coverage-summary.mjs summary coverage API >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: matrix.script == 'test:coverage'
        with:
          name: coverage-api
          path: api/coverage/
          retention-days: 7

  api-db:
    name: API · Tests BDD (Postgres)
    needs: api-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-modules
        with:
          dir: api
      - name: vitest run test/db (npm run test:db)
        run: npm run test:db

  build:
    name: Build
    needs: [check, locales]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-modules
      - name: nuxt build pour l'E2E (npm run build:e2e)
        run: npm run build:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: front-build
          path: .output/
          include-hidden-files: true
          retention-days: 1

  api-build:
    name: API · Build + /health
    needs: [api-check, api-db, locales]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-modules
        with:
          dir: api

      - name: tsc -p tsconfig.build.json (npm run build)
        run: npm run build

      - name: "Smoke test : démarrer l'API et appeler GET /health"
        env:
          NODE_ENV: production
          PORT: 3002
        run: |
          node dist/index.js > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID; echo "--- journal du serveur"; cat server.log' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            http://localhost:3002/health | tee health.json
          echo
          node -e '
            const health = JSON.parse(require("fs").readFileSync("health.json", "utf8"))
            const { version } = JSON.parse(require("fs").readFileSync("package.json", "utf8"))
            const ok = health.status === "ok" && health.env === "production" && health.version === version
            if (!ok) { console.error("Réponse /health inattendue :", health); process.exit(1) }
            console.log(`OK : status=${health.status}, version=${health.version}, env=${health.env}`)
          '

      - name: Paquet AWS Lambda (npm run build:lambda) + appel du handler
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          npm run build:lambda
          node scripts/invoke-lambda.mjs "$GIT_COMMIT"

      - uses: actions/upload-artifact@v7
        with:
          name: api-build
          path: api/dist/
          retention-days: 1

  e2e:
    name: E2E (Playwright)
    needs: [build, api-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-modules
      - name: Récupérer node_modules (api) depuis le cache
        uses: actions/cache/restore@v6
        with:
          path: api/node_modules
          key: node-modules-${{ runner.os }}-node24-api-${{ hashFiles('api/package-lock.json') }}
          fail-on-cache-miss: true

      - name: Récupérer le site compilé (job Build)
        uses: actions/download-artifact@v8
        with:
          name: front-build
          path: .output

      - name: Récupérer l'API compilée (job API · Build)
        uses: actions/download-artifact@v8
        with:
          name: api-build
          path: api/dist

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Démarrer l'API Hono (port 3101)
        working-directory: api
        env:
          PORT: 3101
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:3100
        run: nohup node dist/index.js > ../api.log 2>&1 &

      - name: Démarrer le faux PokéAPI (port 3102)
        env:
          PORT: 3102
        run: nohup node e2e/pokeapi-mock.mjs > pokeapi-mock.log 2>&1 &

      - name: Démarrer le front Nuxt (port 3100)
        env:
          PORT: 3100
          NUXT_PUBLIC_API_BASE: http://localhost:3101
          NUXT_PUBLIC_POKEAPI_BASE: http://localhost:3102
        run: nohup node .output/server/index.mjs > nuxt.log 2>&1 &

      - name: Attendre que les trois serveurs répondent
        run: |
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
            http://localhost:3101/health
          echo
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
            http://localhost:3102/health
          echo
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
            --output /dev/null --write-out "front Nuxt : HTTP %{http_code}\n" http://localhost:3100

      - name: playwright test (npm run e2e)
        run: npm run e2e

      - name: Journaux des serveurs (si échec)
        if: failure()
        run: |
          echo "─── API Hono (api.log) ───"; cat api.log || true
          echo "─── front Nuxt (nuxt.log) ───"; cat nuxt.log || true
          echo "─── faux PokéAPI (pokeapi-mock.log) ───"; cat pokeapi-mock.log || true

      - name: Rapport Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  migrate:
    name: Migrate DB (Supabase)
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: deploy-production-db
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    defaults:
      run:
        working-directory: api
    steps:
      - name: Vérifier la configuration (secret DATABASE_URL)
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Secret manquant : DATABASE_URL"; exit 1; fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-modules
        with:
          dir: api
      - name: Appliquer les migrations (npm run migrate)
        run: npm run migrate

  deploy:
    name: Deploy
    needs: migrate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  coverage:
    name: Publish coverage (rapport + badge)
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SSG_URL }}/coverage/
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      SSG_BUCKET: ${{ vars.SSG_BUCKET }}
      SSG_DISTRIBUTION_ID: ${{ vars.SSG_DISTRIBUTION_ID }}
      SSG_URL: ${{ vars.SSG_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: coverage-front
          path: site/front
      - uses: actions/download-artifact@v8
        with:
          name: coverage-api
          path: site/api
      - name: Badges et page d'accueil du rapport
        run: |
          node scripts/coverage-summary.mjs badge site/front "couverture front" > site/front-badge.json
          node scripts/coverage-summary.mjs badge site/api "couverture API" > site/api-badge.json
          cat site/front-badge.json site/api-badge.json
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Couverture · PokéWishlist</title>' \
            "<h1>Couverture des tests (commit ${GITHUB_SHA:0:7})</h1>" \
            '<ul><li><a href="front/">Front (Nuxt)</a></li><li><a href="api/">API (Hono)</a></li></ul>' > site/index.html
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: pokewishlist-coverage-${{ github.run_id }}
      - name: Publier sur S3 + CloudFront (/coverage/)
        run: |
          aws s3 sync site "s3://$SSG_BUCKET/coverage" --delete \
            --cache-control 'public,max-age=0,must-revalidate' --only-show-errors
          id=$(aws cloudfront create-invalidation --distribution-id "$SSG_DISTRIBUTION_ID" \
            --paths '/coverage/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$SSG_DISTRIBUTION_ID" --id "$id"
      - name: Vérifier en ligne
        run: |
          for f in coverage/front-badge.json coverage/api-badge.json coverage/front/ coverage/api/; do
            code=$(curl --silent --max-time 20 -o /dev/null -w '%{http_code}' "$SSG_URL/$f")
            echo "$SSG_URL/$f → $code"
            [ "$code" = 200 ] || { echo "::error::$f → $code"; exit 1; }
          done
