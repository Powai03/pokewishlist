name: CI

# Se déclenche à chaque push (toutes branches) et à chaque Pull Request.
on:
  push:
  pull_request:

# Si on repousse sur la même branche, on annule l'exécution précédente devenue inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 5 jobs indépendants = 5 « checks » distincts visibles sur la PR (+ le job e2e plus bas).
  # Chaque check porte le nom de son OUTIL ; `cmd` affiche la commande réellement lancée
  # (celle du script npm correspondant dans package.json).
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # un check rouge n'arrête pas les autres
      matrix:
        include:
          - name: ESLint
            script: lint
            cmd: eslint . --max-warnings 0
          - name: Prettier
            script: format:check
            cmd: prettier --check .
          - name: TypeScript
            script: typecheck
            cmd: nuxt typecheck
          - name: Vitest
            script: test
            cmd: vitest run
          - name: Build Nuxt
            script: build
            cmd: nuxt build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci # installe exactement les versions du package-lock.json

      - name: ${{ matrix.cmd }} (npm run ${{ matrix.script }})
        run: npm run ${{ matrix.script }}

  # Test de bout en bout : un vrai navigateur ajoute un Pokémon, rafraîchit, vérifie la liste.
  # Le front buildé parle à la VRAIE API buildée (playwright.config.ts démarre les deux serveurs).
  e2e:
    name: Playwright (E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Installer les dépendances de l'API
        run: npm ci
        working-directory: api

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Build de l'application
        run: npm run build

      - name: Build de l'API
        run: npm run build
        working-directory: api

      # Les deux serveurs sont démarrés EXPLICITEMENT (visibles dans Actions), en arrière-plan,
      # avec leurs journaux dans des fichiers. Playwright les réutilise (reuseExistingServer en CI).
      - name: Démarrer l'API Hono (port 3101)
        working-directory: api
        env:
          PORT: 3101
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:3100
        run: nohup node dist/index.js > ../api.log 2>&1 &

      - name: Démarrer le front Nuxt (port 3100)
        env:
          PORT: 3100
          NUXT_PUBLIC_API_BASE: http://localhost:3101
        run: nohup node .output/server/index.mjs > nuxt.log 2>&1 &

      - name: Attendre que les deux serveurs répondent
        run: |
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
            http://localhost:3101/health
          echo
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
            --output /dev/null --write-out "front Nuxt : HTTP %{http_code}\n" http://localhost:3100

      - name: playwright test (npm run e2e)
        run: npm run e2e

      - name: Journaux des serveurs (si échec)
        if: failure()
        run: |
          echo "─── API Hono (api.log) ───"; cat api.log || true
          echo "─── front Nuxt (nuxt.log) ───"; cat nuxt.log || true

      - name: Rapport Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── API (Hono + TypeScript), dossier api/ : ses PROPRES outils (api/package.json) ──
  # Même principe que le front : un check par outil, pour voir tout de suite lequel échoue.
  api-check:
    name: API · ${{ matrix.name }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESLint
            script: lint
            cmd: eslint . --max-warnings 0
          - name: Prettier
            script: format:check
            cmd: prettier --check .
          - name: TypeScript
            script: typecheck
            cmd: tsc --noEmit
          - name: Vitest
            script: test
            cmd: vitest run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Installer les dépendances (npm ci)
        run: npm ci

      - name: ${{ matrix.cmd }} (npm run ${{ matrix.script }})
        run: npm run ${{ matrix.script }}

  # Tests d'intégration du stockage sur un VRAI serveur PostgreSQL 17 (même version que Supabase),
  # lancé à côté du job (« service container ») : base jetable, isolée, détruite à la fin du job.
  # Le schéma vient de supabase/init.sql ; aucun mock SQL. (En local, ces tests utilisent PGlite.)
  api-db:
    name: API · Vitest sur PostgreSQL 17
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          # Base jetable, joignable seulement depuis ce job : connexion sans mot de passe (« trust »).
          # Aucun mot de passe dans le dépôt → rien que GitGuardian puisse signaler.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Installer les dépendances (npm ci)
        run: npm ci

      - name: vitest run test/db (npm run test:db)
        run: npm run test:db

  # Build de l'API, puis démarrage du vrai serveur compilé et appel de GET /health (smoke test).
  api-build:
    name: API · Build + smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Installer les dépendances (npm ci)
        run: npm ci

      - name: tsc -p tsconfig.build.json (npm run build)
        run: npm run build

      - name: "Smoke test : démarrer l'API et appeler GET /health"
        env:
          NODE_ENV: production
          PORT: 3002
        run: |
          # Le serveur écrit dans server.log et est TOUJOURS arrêté à la fin (succès ou échec).
          node dist/index.js > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID; echo "--- journal du serveur"; cat server.log' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            http://localhost:3002/health | tee health.json
          echo
          node -e '
            const health = JSON.parse(require("fs").readFileSync("health.json", "utf8"))
            const { version } = JSON.parse(require("fs").readFileSync("package.json", "utf8"))
            const ok = health.status === "ok" && health.env === "production" && health.version === version
            if (!ok) { console.error("Réponse /health inattendue :", health); process.exit(1) }
            console.log(`OK : status=${health.status}, version=${health.version}, env=${health.env}`)
          '
